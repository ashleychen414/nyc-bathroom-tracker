# Publishes the app to GitHub Pages on every push to main. Nightly, it also refreshes
# the restroom data from NYC Open Data and commits it when the city data changed;
# that commit is what makes Vercel republish. If the city's API is down, the committed
# data is kept. Every run then copies that data into the shared Supabase bathrooms table
# (skipped until the SUPABASE_SECRET_KEY secret exists). Nightly runs also ping Supabase
# so the free-plan project stays awake.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *' # daily, ~5am New York time
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Unit tests stay on every run: they're quick and touch nothing live, and they catch a main
      # that breaks after two separately-tested PRs merge, or a push made without a PR.
      - run: npm test
      - name: Check database access rules (anonymous visitor)
        # Already checked on the PR (test.yml), and each run writes an rls-check row into the live
        # location_events table, so pushes skip it. Nightly and manual runs still check.
        if: github.event_name != 'push'
        run: npm run test:rls
      - name: Refresh restroom data
        if: github.event_name != 'push'
        run: |
          if npm run data; then
            if [ -n "$(git status --porcelain public/data data)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add public/data data
              git commit -m "Refresh restroom data from NYC Open Data"
              git push
            fi
          else
            echo "::warning::Data refresh failed; deploying the committed data"
          fi
      - name: Update the shared bathrooms table
        # Upserts public/data/bathrooms.json into public.bathrooms (scripts/sync-bathrooms.mjs).
        # SUPABASE_SECRET_KEY is a Supabase secret key (service role): repo Settings → Secrets
        # and variables → Actions. Without it this step skips; a failure warns but still deploys.
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run sync:bathrooms || echo "::warning::Bathrooms table update failed; the app still reads the JSON file"
      - name: Keep the Supabase project awake
        if: github.event_name != 'push'
        # Free-plan projects pause after ~7 quiet days; one small query a day prevents it.
        # The project URL and publishable key come from the app's own config (public by design:
        # row-level security protects the data).
        run: |
          node --input-type=module -e "
            import { SUPABASE_URL, SUPABASE_KEY } from './src/lib/supabase-config.js';
            const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/keep_alive', {
              method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: '{}',
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
          " || echo "::warning::Supabase keep-alive failed"
      - run: node scripts/assemble-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
