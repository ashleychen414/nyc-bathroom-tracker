# Publishes the app to GitHub Pages on every push to main. Nightly, it also refreshes
# the restroom data from NYC Open Data and commits it when the city data changed;
# that commit is what makes Vercel republish. If the city's API is down, the committed
# data is kept.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *' # daily, ~5am New York time
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Refresh restroom data
        if: github.event_name != 'push'
        run: |
          if npm run data; then
            if [ -n "$(git status --porcelain public/data data)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add public/data data
              git commit -m "Refresh restroom data from NYC Open Data"
              git push
            fi
          else
            echo "::warning::Data refresh failed; deploying the committed data"
          fi
      - run: node scripts/assemble-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
