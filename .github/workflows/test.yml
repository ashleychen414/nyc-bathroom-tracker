# Runs the checks on every pull request, so a broken branch is caught before it reaches main
# (deploy.yml only tests after a push to main, which is already live).
name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: Check database access rules (anonymous visitor)
        run: npm run test:rls
